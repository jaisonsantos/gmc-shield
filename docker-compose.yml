services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: gmc_shield
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/gmc_shield
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173
      # SECRET_KEY pode vir do .env; se não tiver, defina aqui:
      # SECRET_KEY: change_me
    volumes:
      - ./api:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: bash -lc "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/gmc_shield
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./api:/app
      - ./worker:/worker
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    command: bash -lc "python -u /worker/run_worker.py"
    restart: unless-stopped

volumes:
  db_data:
