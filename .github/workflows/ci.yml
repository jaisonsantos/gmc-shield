name: CI
on: [push, pull_request]
jobs:
  api-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r api/requirements.txt
      - run: python -m compileall api
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd web && npm install && npm run build
  docs-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check D0..D30 (skip missing files)
        run: |
          for i in $(seq -w 0 30); do
            if [ ! -f "docs/issues/D${i}*.md" ]; then
              echo "Warning: docs/issues/D${i}*.md is missing or deleted, skipping."
              continue
            fi
          done
      - name: Check existing T* files
        run: |
          # Lista todos os arquivos T*.md e verifica se existem
          for file in docs/issues/T*.md; do
            if [ ! -f "$file" ]; then
              echo "Warning: $file is missing, skipping."
              continue
            fi
          done
      - name: Prepare .env for compose
        run: |
          {
            echo "POSTGRES_USER=postgres"
            echo "POSTGRES_PASSWORD=postgres"
            echo "POSTGRES_DB=gmcshield"
            echo "REDIS_URL=redis://localhost:6379/0"
          } > .env
      - name: Compose config
        run: docker compose config -q
