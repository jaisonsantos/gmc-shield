# docker-compose.yml
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: gmc_shield
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [db_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    env_file: [.env]
    volumes:
      - ./api:/app
    ports: ["8000:8000"]
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_healthy }
    command: bash -lc "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    env_file: [.env]
    environment:
      DEMO_FEED_CSV: /docs/seed/demo_feed.csv
    volumes:
      - ./api:/app
      - ./worker:/worker
      - ./docs:/docs
      - artifacts:/worker/artifacts
    depends_on:
      api:   { condition: service_started }
      redis: { condition: service_healthy }
    command: bash -lc "python -u /worker/run_worker.py"
    restart: unless-stopped

  rq-feed:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    env_file: [.env]
    volumes:
      - ./api:/app
    depends_on:
      redis: { condition: service_healthy }
    command: bash -lc "rq worker -u $REDIS_URL feed"
    restart: unless-stopped

  rq-crawl:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    env_file: [.env]
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./api:/app
    command: bash -lc "rq worker -u $REDIS_URL crawl"
    restart: unless-stopped

volumes:
  db_data:
  artifacts:
